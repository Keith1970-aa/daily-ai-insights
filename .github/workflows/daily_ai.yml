name: Daily AI Insight Engine
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Fetch Real AI News from Gemini
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # This tells the AI to find 2 real news stories and format them for your website
          curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}" \
          -H 'Content-Type: application/json' \
          -d '{
            "contents": [{
              "parts":[{
                "text": "Search for 2 trending AI business tool news items from the last 24 hours. Output ONLY a raw JSON object like this: {\"date\": \"'$(date)'\", \"insights\": [{\"title\": \"Short Title\", \"summary\": \"1-sentence summary\"}]}"
              }]
            }]
          }' > response.json
          
          # This cleans the AI response so the website can read it
          cat response.json | jq -r '.candidates[0].content.parts[0].text' | sed 's/```json//g' | sed 's/```//g' > daily_report.json

      - name: Save News to Website
        run: |
          git config --global user.name "AI-Engine"
          git config --global user.email "action@github.com"
          git add daily_report.json
          git commit -m "Update website with real daily news"
          git push
